# Fichier .gitlab-ci.yml à placer à la racine de votre projet
stages:
  - test

run_tests:
  stage: test
  
  script:
    # Exécuter votre script de test
    - chmod +x ./src/test/script/non_regression_lex.sh
    - ./src/test/script/non_regression_lex.sh
  # Définir quand la pipeline doit s'exécuter
  rules:
    # Sur chaque push
    - if: '$CI_PIPELINE_SOURCE == "push"'
    # Sur chaque merge request
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
  # Arrêter la pipeline si les tests échouent
  allow_failure: false